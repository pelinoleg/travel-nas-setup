<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, initial-scale=1, user-scalable=no">
<meta name="google" content="notranslate">
<title>NAS</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/uplot.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="addr"><span id="host">…</span><span id="ip" class="ip"></span></div>
    <div class="chips" id="topchips"></div>
    <div class="right"><span id="clock"></span>
      <button id="btn-power" title="Питание">⏻</button>
      <button id="btn-exit" title="На десктоп">⤓</button></div>
  </div>
  <nav id="tabs">
    <button data-tab="overview" class="active">Обзор</button>
    <button data-tab="system">Система</button>
    <button data-tab="storage">Диски</button>
    <button data-tab="docker">Docker</button>
    <button data-tab="logs">Логи</button>
    <button data-tab="settings">⚙</button>
  </nav>
</header>

<main>
  <!-- OVERVIEW -->
  <section id="tab-overview" class="tab active">
    <div class="cards">
      <div class="card" data-metric="cpu"><div class="k">CPU</div><div class="v"><b id="cpu">–</b>%</div><canvas class="spark" data-s="cpu"></canvas><div class="sub" id="cpu-sub"></div></div>
      <div class="card" data-metric="temp"><div class="k">ТЕМП</div><div class="v"><b id="temp">–</b>°</div><canvas class="spark" data-s="temp"></canvas><div class="sub" id="temp-sub"></div></div>
      <div class="card" data-metric="mem"><div class="k">RAM</div><div class="v"><b id="mem">–</b></div><canvas class="spark" data-s="mem"></canvas><div class="sub" id="mem-sub">GB</div></div>
      <div class="card" data-metric="net_rx"><div class="k">СЕТЬ</div><div class="v" style="font-size:18px"><span id="net">–</span></div><canvas class="spark" data-s="net_rx"></canvas><div class="sub">↑↓ MB/s</div></div>
    </div>
    <div class="chiprow" id="ovchips"></div>
    <div class="graphpanel">
      <div class="graphhead"><span id="graph-title"></span>
        <span class="ranges">
          <button data-range="1h" class="active">1ч</button>
          <button data-range="24h">24ч</button>
          <button data-range="7d">7д</button></span></div>
      <div id="chart"></div>
    </div>
  </section>

  <!-- SYSTEM -->
  <section id="tab-system" class="tab">
    <div class="chiprow" id="syschips"></div>
    <div class="cols">
      <div><div class="h">Топ процессов</div><table id="proc"></table></div>
      <div><div class="h">Графики</div>
        <div class="minigraphs">
          <div><span class="gl">CPU</span><div id="g-cpu" class="mg"></div></div>
          <div><span class="gl">Температура</span><div id="g-temp" class="mg"></div></div>
          <div><span class="gl">RAM</span><div id="g-mem" class="mg"></div></div>
        </div></div>
    </div>
  </section>

  <!-- STORAGE / DISKS -->
  <section id="tab-storage" class="tab"><div id="disks" class="diskgrid"></div></section>

  <!-- DOCKER -->
  <section id="tab-docker" class="tab"><div id="projects" class="projgrid"></div></section>

  <!-- LOGS -->
  <section id="tab-logs" class="tab">
    <div class="logbar"><button id="logs-refresh">Обновить</button></div>
    <pre id="logs-body">…</pre></section>

  <!-- SETTINGS -->
  <section id="tab-settings" class="tab">
    <div class="setrow"><label>Яркость</label>
      <input type="range" id="brightness" min="5" max="100" value="80">
      <span id="brightness-val">80%</span></div>
    <div class="setrow"><label>Гасить экран через</label>
      <select id="screen-timeout">
        <option value="0">никогда</option><option value="60">1 мин</option>
        <option value="300">5 мин</option><option value="600">10 мин</option>
        <option value="1800">30 мин</option></select></div>
    <div class="setrow"><label>Ночное затемнение</label>
      <input type="time" id="night-from" value="23:00"> – <input type="time" id="night-to" value="07:00">
      до <input type="number" id="night-level" min="5" max="100" value="20">%</div>
    <div class="setrow"><label>Поворот (нужен reboot)</label>
      <select id="rotate"><option value="">—</option><option>0</option><option>90</option>
        <option>180</option><option>270</option></select>
      <button id="rotate-apply">Применить</button></div>
    <div class="setrow"><label>Power-профиль</label>
      <span class="seg" id="powermode">
        <button data-mode="auto">Auto</button><button data-mode="normal">Normal</button>
        <button data-mode="saver">Saver</button></span></div>
    <div class="setrow"><label>Обновление</label>
      <button id="act-update">Обновить скрипты с GitHub</button>
      <button id="act-boost">CPU Boost (5 мин)</button></div>
    <div class="note">Авто-яркости нет (на панели нет датчика света) — работает ночное расписание выше.</div>
  </section>
</main>

<div id="modal" class="modal hidden"><div class="modalbox">
  <h3 id="modal-title"></h3><div id="modal-body" class="modalbtns"></div>
  <button id="modal-cancel" class="cancel">Отмена</button></div></div>
<div id="toast" class="toast hidden"></div>

<script src="/static/uplot.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
