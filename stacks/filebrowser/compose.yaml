# Filebrowser Quantum (форк gtsteffaniak) — приятный UI, индексный поиск,
# мультиисточник. В отличие от оригинала пароль детерминирован: config.yaml
# (auth.adminPassword), генерится setup.sh из filebrowser.conf. Бежит user 1000
# чтобы читать 600-секреты в /etc/travel-nas. config.yaml + БД — в data-каталоге.
name: filebrowser
services:
  filebrowser:
    image: gtstef/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8082:8080"
    volumes:
      - /mnt/storage/_appdata/filebrowser-quantum:/home/filebrowser/data   # config.yaml + sqlite
      - /mnt/storage:/srv/storage          # файлы диска (источник по умолчанию)
      - /etc/travel-nas:/srv/config        # конфиги (правка через веб)
