# Filebrowser — классический UI (образ :v2 без s6: entrypoint /filebrowser, без
# авто-генерации случайного пароля). Пароль детерминирован: setup.sh pre-seed'ит
# БД (config init + users add/update) из filebrowser.conf ДО старта сервера.
# user 1000 — читать 600-секреты в /etc/travel-nas. Root /srv → диск и конфиги
# подкаталогами (storage/, config/).
name: filebrowser
services:
  filebrowser:
    image: filebrowser/filebrowser:v2
    container_name: filebrowser
    restart: unless-stopped
    user: "1000:1000"
    command: ["-d", "/database/filebrowser.db", "-r", "/srv"]
    ports:
      - "8082:80"
    volumes:
      - /mnt/storage/_appdata/filebrowser:/database     # bbolt БД
      - /mnt/storage:/srv/storage                       # файлы диска
      - /etc/travel-nas:/srv/config                     # конфиги (правка через веб)
