# Filebrowser — web файл-менеджер + редактор конфигов. PUID/PGID=1000 чтобы
# читать/писать 600-секреты в /etc/travel-nas (owner uid 1000). Креды — в
# /etc/travel-nas/filebrowser.conf, выставляются в setup.sh (stack_post).
name: filebrowser
services:
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "8082:80"
    volumes:
      - /mnt/storage:/srv/storage          # файлы диска
      - /etc/travel-nas:/srv/config        # конфиги (правка через веб)
      - /mnt/storage/_appdata/filebrowser:/database
