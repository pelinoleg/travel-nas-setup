# Photoview app + MariaDB. В UI указывай пути /storage/usb-imports, /storage/media
# — это ВНУТРИ контейнера (диск смонтирован как /storage:ro). UID 999 = mysql.
name: photoview
services:
  db:
    image: mariadb:10.11
    container_name: photoview-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=photoview
      - MYSQL_USER=photoview
      - MYSQL_PASSWORD=photoview
      - MYSQL_RANDOM_ROOT_PASSWORD=1
    volumes:
      - /mnt/storage/_appdata/photoview/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  photoview:
    image: viktorstrate/photoview:latest
    container_name: photoview
    restart: unless-stopped
    # Лимит CPU на скан/тумбнейлинг (на ARM жрёт все ядра). ${PV_*} из .env
    # (пишет setup.sh адаптивно под модель Pi). cgroup-кап + число воркеров скана.
    deploy:
      resources:
        limits:
          cpus: "${PV_CPU_LIMIT:-2.0}"
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PHOTOVIEW_DATABASE_DRIVER=mysql
      - PHOTOVIEW_MYSQL_URL=photoview:photoview@tcp(db)/photoview
      - PHOTOVIEW_LISTEN_IP=0.0.0.0
      - PHOTOVIEW_LISTEN_PORT=80
      - PHOTOVIEW_MEDIA_CACHE=/app/cache
      - PHOTOVIEW_CONCURRENT_WORKERS=${PV_WORKERS:-2}
    volumes:
      - /mnt/storage/_appdata/photoview/cache:/app/cache
      - /mnt/storage:/storage:ro
