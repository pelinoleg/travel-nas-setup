# Syncthing — P2P-синхронизация. PUID/PGID=1000 (файлы принадлежат человеку).
# ${TZ} из .env (setup.sh пишет из /etc/timezone).
name: syncthing
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    # CPU-лимит хеширования при скане больших папок (${ST_CPU_LIMIT} из .env,
    # адаптивно под Pi). Иначе скан может занять все ядра.
    deploy:
      resources:
        limits:
          cpus: "${ST_CPU_LIMIT:-2.0}"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - "8384:8384"        # Web UI
      - "22000:22000/tcp"  # sync protocol
      - "22000:22000/udp"
      - "21027:21027/udp"  # local discovery
    volumes:
      - /mnt/storage/_appdata/syncthing:/config
      - /mnt/storage/sync:/data
