# YT-Archiver (yt-dlp + FastAPI + React). ${YT_CPU_LIMIT}/${MEM_LIMIT} берутся
# из .env рядом (его пишет setup.sh из yt-archiver.conf + модели Pi). docker
# compose подставляет ${VAR} из .env нативно. Backend без published-порта
# (frontend ходит к нему по сети ytarchiver_net), наружу только frontend :8081.
#
# bgutil-provider — Proof-of-Origin token provider: backend's yt-dlp ходит к нему
# по сети (POT_PROVIDER_URL) и проходит YouTube «Sign in to confirm you're not a
# bot» без cookies. watchtower авто-обновляет ТОЛЬКО его (label-scoped) — YouTube
# периодически меняет анти-бот. Cookies (cookies/youtube.txt) — опц. fallback.
# VPN exit-pool (opt-in): положи WireGuard *.conf в wireguard/ — backend через
# docker.sock поднимет gluetun-туннели (wgvpn-*) и погонит yt-dlp через них.
# Пустая папка = прямые загрузки. Сервисы для VPN тут НЕ нужны — туннели рантайм.
name: ytarchiver
services:
  backend:
    image: ghcr.io/pelinoleg/ytarchiver-backend:latest
    container_name: ytarchiver-backend
    hostname: ytarchiver-backend
    restart: unless-stopped
    cpu_shares: 90
    deploy:
      resources:
        limits:
          cpus: "${YT_CPU_LIMIT}"
          memory: "${MEM_LIMIT}"
    environment:
      BETWEEN_DOWNLOADS_MAX_SECONDS: "15"
      BETWEEN_DOWNLOADS_MIN_SECONDS: "5"
      CORS_ORIGINS: "*"
      DATA_DIR: /data
      DB_PATH: /data/ytarchiver.db
      DEFAULT_PLAYBACK_RATE: "1.0"
      DEFAULT_QUALITY: "1080"
      DEFAULT_RETENTION_DAYS: "0"
      DELETE_AFTER_WATCHED_PERCENT: "0"
      DOWNLOAD_DIR: /downloads
      INITIAL_BACKFILL_HARD_CAP: "500"
      LOG_LEVEL: INFO
      MAX_VIDEOS_PER_CHANNEL_SCAN: "50"
      MINI_PLAYER_ENABLED: "true"
      MUSIC_PLAYBACK_RATE: "1.0"
      MUSIC_QUEUE_PANEL_SIZE: "100"
      PREVIEW_CRF: "27"
      PREVIEW_SEGMENTS: "12"
      PREVIEW_WIDTH: "480"
      SPONSORBLOCK_API: https://sponsor.ajay.app
      SPONSORBLOCK_REFRESH_DAYS: "7"
      SYNC_INTERVAL_MINUTES: "240"
      SYNC_JITTER_MINUTES: "60"
      # YouTube bot-detection bypass: POT-токены через bgutil-provider (без cookies).
      POT_PROVIDER_URL: "http://bgutil-provider:4416"
      # Опц. fallback: Netscape cookies.txt (mount :ro). Обычно не нужен с POT.
      COOKIES_FILE: /cookies/youtube.txt
      # Принудительный yt-dlp player client. Пусто = yt-dlp выбирает сам.
      YOUTUBE_PLAYER_CLIENT: ""
      # VPN exit-pool (folder-driven WireGuard): backend через docker.sock
      # поднимает по gluetun-туннелю (wgvpn-*) на каждый *.conf в /wireguard,
      # гоняет yt-dlp через здоровые, ротирует при блоке YouTube. ПУСТАЯ папка
      # = прямые загрузки (VPN выключен). VPN_DOCKER_NETWORK = имя нашей сети,
      # чтобы туннели поднимались в ней и backend их резолвил.
      WIREGUARD_CONFIGS_DIR: /wireguard
      VPN_DOCKER_NETWORK: ytarchiver_ytarchiver_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ytarchiver_net
    volumes:
      - type: bind
        source: /mnt/storage/media/YT-Archiver/data
        target: /data
      - type: bind
        source: /mnt/storage/media/YT-Archiver/video
        target: /downloads
      - type: bind
        source: /mnt/storage/media/YT-Archiver/cookies
        target: /cookies
        read_only: true
      # VPN exit-pool: docker.sock — чтобы backend спавнил gluetun-туннели;
      # wireguard/ — папка с *.conf (положи туда конфиги, чтобы включить VPN).
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /mnt/storage/media/YT-Archiver/wireguard
        target: /wireguard
  frontend:
    image: ghcr.io/pelinoleg/ytarchiver-frontend:latest
    container_name: ytarchiver-frontend
    hostname: ytarchiver-frontend
    restart: unless-stopped
    cpu_shares: 90
    deploy:
      resources:
        limits:
          memory: "${MEM_LIMIT}"
    depends_on:
      backend:
        condition: service_started
        required: true
    networks:
      - ytarchiver_net
    ports:
      - "8081:80"   # короткий синтаксис → Dockge делает порт кликабельным

  # POT-провайдер: backend's yt-dlp ходит к нему по ytarchiver_net
  # (http://bgutil-provider:4416), чтобы пройти бот-стену YouTube без cookies.
  # Без published-порта — только внутренняя сеть.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    hostname: bgutil-provider
    restart: unless-stopped
    networks:
      - ytarchiver_net
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Авто-обновляет ТОЛЬКО bgutil-provider (WATCHTOWER_LABEL_ENABLE → по label выше),
  # чтобы обход бот-стены жил сам. НАШИ образы (backend/frontend) НЕ трогает — они
  # едут через CI + travel-nas-update --full. containrrr/watchtower заброшен и
  # ломается на новых Docker API → берём поддерживаемый форк nickfedor.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  ytarchiver_net:
    name: ytarchiver_ytarchiver_net
    driver: bridge
